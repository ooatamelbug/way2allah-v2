; Production-like php.ini overrides (php.ini-production is Ubuntu's default for CGI/CLI). Undocumented production
; values are left at php.ini-production defaults: output_buffering=4096, ignore_user_abort=Off,
; zend.exception_ignore_args=On, max_execution_time=30 (CGI: wall time is not limited on Linux — CPU time only).
memory_limit = 256M
date.timezone = UTC
opcache.enable = 1
opcache.enable_cli = 0
