# Prefork, as production (WHM-managed; MaxRequestWorkers 800 there). Lab limits are set from the environment.
<IfModule mpm_prefork_module>
    StartServers            5
    MinSpareServers         5
    MaxSpareServers        20
    ServerLimit            ${LAB_MAX_WORKERS}
    MaxRequestWorkers      ${LAB_MAX_WORKERS}
    MaxConnectionsPerChild  0
</IfModule>
Timeout 300

Listen 8081
Listen 8082

# --- FastCGI: mod_fcgid + php-cgi --------------------------------------------------------------------------------
<IfModule mod_fcgid.c>
    FcgidMaxProcesses          ${LAB_MAX_WORKERS}
    FcgidMaxProcessesPerClass  ${LAB_MAX_WORKERS}
    FcgidMinProcessesPerClass  0
    FcgidIOTimeout             3600
    FcgidBusyTimeout           7200
    FcgidIdleTimeout           300
    FcgidConnectTimeout        20
    FcgidOutputBufferSize      ${LAB_FCGID_OUTPUT_BUFFER}
    FcgidMaxRequestLen         1073741824
</IfModule>
<VirtualHost *:8081>
    DocumentRoot /app/public
    <Directory /app/public>
        Options +ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
        AddHandler fcgid-script .php
        FcgidWrapper /usr/local/bin/php-fcgi-wrapper .php
    </Directory>
    ErrorLog /proc/self/fd/2
    LogFormat "%h %t \"%r\" %>s %b %D %X fcgid" labfmt
    CustomLog /var/log/apache2/fcgid-access.log labfmt
</VirtualHost>

# --- Plain CGI: mod_cgid + Action (one php-cgi process per request) ------------------------------------------------
<VirtualHost *:8082>
    DocumentRoot /app/public
    ScriptAlias /lab-cgi-bin/ /usr/lib/cgi-bin/
    <Directory /usr/lib/cgi-bin>
        Options +ExecCGI
        Require all granted
    </Directory>
    <Directory /app/public>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
        AddHandler application/x-httpd-lab-php .php
        Action application/x-httpd-lab-php /lab-cgi-bin/php8.3
    </Directory>
    ErrorLog /proc/self/fd/2
    LogFormat "%h %t \"%r\" %>s %b %D %X cgi" labfmt
    CustomLog /var/log/apache2/cgi-access.log labfmt
</VirtualHost>
